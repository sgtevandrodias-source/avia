<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- interactive-widget=resizes-content: no Chrome do Android, o teclado
         passa a encolher a página (em vez de só cobri-la), pra o campo de
         adicionar fixo no rodapé subir junto e continuar visível. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <link rel="manifest" href="/manifest.json" />

    <!-- iOS: comportamento de app instalado (standalone) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AVIA" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Android/Chrome: comportamento de app instalado (standalone) -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <!-- Em arquivo próprio: a política de segurança não aceita script embutido. -->
    <script src="/registrar-sw.js"></script>
  </body>
</html>
